
global
    log stdout format raw local0
    maxconn 10000

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client  1h
    timeout server  1h

frontend nostr_ingress
    bind *:7777
    default_backend nostr_relays

backend nostr_relays
    balance leastconn
    option tcp-check

    server relay_a relay_a:7777 check
    server relay_b relay_b:7777 check
    server relay_c relay_c:7777 check
